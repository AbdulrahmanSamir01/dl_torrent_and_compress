name: Run Torrent Pipeline

on:
  workflow_dispatch:
    inputs:
      torrent_source:
        description: "Magnet URI or direct HTTP(S) URL to a .torrent file"
        required: true
        type: string

      confirm_rights:
        description: "I have the right to download and share this content"
        required: true
        default: false
        type: boolean

      archive_name:
        description: "Output ZIP filename (without .zip is also accepted)"
        required: true
        default: "torrent_download"
        type: string

      compression_level:
        description: "ZIP compression level (0 = store, 9 = maximum)"
        required: true
        default: "6"
        type: choice
        options:
          - "0"
          - "1"
          - "3"
          - "6"
          - "9"

      timeout_hours:
        description: "Maximum torrent download time in hours (0 = no timeout)"
        required: true
        default: "6"
        type: string

      remote_path:
        description: "Optional destination folder in VikingFile"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: torrent-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate authorization confirmation
        if: ${{ inputs.confirm_rights != true }}
        run: |
          echo "ERROR: Confirm that you have the right to download and share this content."
          exit 1

      - name: Install aria2
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes aria2
          aria2c --version | head -n 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pip-torrent.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pip-torrent.txt

      - name: Run torrent pipeline
        env:
          TORRENT_SOURCE: ${{ inputs.torrent_source }}
          CONFIRM_RIGHTS: ${{ inputs.confirm_rights }}
          ARCHIVE_NAME: ${{ inputs.archive_name }}
          COMPRESSION_LEVEL: ${{ inputs.compression_level }}
          TIMEOUT_HOURS: ${{ inputs.timeout_hours }}
          REMOTE_PATH: ${{ inputs.remote_path }}
          VIKINGFILE_USER_HASH: ${{ secrets.VIKINGFILE_USER_HASH }}
        run: |
          set -euo pipefail

          if [[ "${CONFIRM_RIGHTS,,}" != "true" ]]; then
            echo "ERROR: Authorization confirmation is required."
            exit 1
          fi

          args=(
            --source "$TORRENT_SOURCE"
            --archive-name "$ARCHIVE_NAME"
            --compression-level "$COMPRESSION_LEVEL"
            --timeout-hours "$TIMEOUT_HOURS"
            --confirm-rights
          )

          if [[ -n "$REMOTE_PATH" ]]; then
            args+=(--remote-path "$REMOTE_PATH")
          fi

          python main_torrent.py "${args[@]}"
